<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invitation</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Noto Serif JP',serif;
  background:#F5F1EA;
  color:#4A4A4A;
  text-align:center;
  line-height:1.9;
  position:relative;
}

/* 背景ベージュアニメーション */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 20% 30%, rgba(200,182,166,0.25), transparent 40%),
             radial-gradient(circle at 80% 70%, rgba(216,207,196,0.25), transparent 40%);
  animation:bgMove 18s ease-in-out infinite alternate;
  z-index:-1;
}
@keyframes bgMove{
  0%{transform:translateY(0);}
  100%{transform:translateY(-40px);}
}

section{
  padding:100px 20px;
  max-width:1000px;
  margin:auto;
}

h1,h2,h3{font-weight:400;}

/* HERO */
.hero{
  height:90vh;
  background:url("hero.jpg") center/cover no-repeat;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.25);
}
.hero-text{position:relative;z-index:2;}

.countdown{
  margin-top:20px;
  font-size:20px;
  letter-spacing:2px;
}

/* PROFILE */
.profile-wrap{display:flex;flex-direction:column;gap:80px;}
.profile-row{display:flex;align-items:center;justify-content:center;gap:50px;flex-wrap:wrap;}
.profile-row.reverse{flex-direction:row-reverse;}
.profile-row img{width:220px;height:220px;object-fit:cover;border-radius:50%;}
.profile-text{max-width:400px;text-align:left;}

/* GALLERY */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;}
.gallery img{width:100%;border-radius:15px;cursor:pointer;transition:0.4s;}
.gallery img:hover{transform:scale(1.05);}

/* MODAL */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);
justify-content:center;align-items:center;z-index:999;}
.modal img{max-width:90%;max-height:80%;border-radius:10px;}

/* TIMELINE */
.timeline{position:relative;padding-left:40px;text-align:left;max-width:600px;margin:auto;}
.timeline::before{
  content:"";position:absolute;left:20px;top:0;bottom:0;width:2px;background:#D8CFC4;
}
.timeline-item{margin-bottom:40px;position:relative;}
.timeline-item::before{
  content:"";position:absolute;left:-30px;top:8px;width:12px;height:12px;
  background:#C8B6A6;border-radius:50%;
}

/* SCHEDULE */
.schedule{max-width:600px;margin:auto;text-align:left;}
.schedule-item{
  display:flex;justify-content:space-between;
  padding:12px 0;border-bottom:1px solid #E5DDD5;
}

/* MAP */
.map-wrap iframe{
  width:100%;
  height:400px;
  border:0;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.08);
}
.map-button{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  background:#C8B6A6;
  color:white;
  border-radius:30px;
  text-decoration:none;
  transition:0.3s;
}
.map-button:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

/* FORM */
form{max-width:500px;margin:auto;}
input,textarea{
  width:100%;padding:12px;margin:10px 0;
  border:1px solid #D8CFC4;border-radius:8px;
}
button{
  margin-top:20px;padding:14px 30px;
  background:#C8B6A6;color:white;border:none;border-radius:30px;
  cursor:pointer;transition:0.3s;
}
button:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

/* 📱スマホ最適化 */
@media(max-width:768px){
section{padding:60px 20px;}
.hero{height:80vh;}
h1{font-size:26px;}
.countdown{font-size:16px;}
.profile-row{flex-direction:column !important;gap:20px;}
.profile-text{text-align:center;}
.timeline{padding-left:30px;}
.schedule-item{font-size:14px;}
}
</style>
</head>

<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-text" data-aos="fade-up">
    <h1>Wedding Invitation</h1>
    <p>R & M</p>
    <p>2027.02.25</p>
    <div class="countdown" id="countdown"></div>
  </div>
</div>

<!-- INTRO -->
<section data-aos="fade-up">
<h2>Welcome</h2>
<p>私たちの大切な一日に<br>ぜひご出席いただけますと幸いです。</p>
</section>

<!-- PROFILE -->
<section data-aos="fade-up">
<h2>Profile</h2>
<div class="profile-wrap">
<div class="profile-row">
<img src="groom.jpg">
<div class="profile-text">
<h3>Groom</h3>
<p>簡単な自己紹介文をここに。</p>
</div>
</div>
<div class="profile-row reverse">
<img src="bride.jpg">
<div class="profile-text">
<h3>Bride</h3>
<p>簡単な自己紹介文をここに。</p>
</div>
</div>
</div>
</section>

<!-- ALBUM -->
<section data-aos="fade-up">
<h2>Album</h2>
<div class="gallery">
<img src="photo1.jpg" onclick="openModal(this.src)">
<img src="photo2.jpg" onclick="openModal(this.src)">
<img src="photo3.jpg" onclick="openModal(this.src)">
<img src="photo4.jpg" onclick="openModal(this.src)">
</div>
</section>

<div class="modal" id="modal" onclick="closeModal()">
<img id="modalImg">
</div>

<!-- OUR STORY -->
<section data-aos="fade-up">
<h2>Our Story</h2>
<div class="timeline">
<div class="timeline-item"><strong>2022</strong><br>出会い</div>
<div class="timeline-item"><strong>2024</strong><br>プロポーズ</div>
<div class="timeline-item"><strong>2027</strong><br>Wedding Day</div>
</div>
</section>

<!-- SCHEDULE -->
<section data-aos="fade-up">
<a href="rsvp.html">
<button>招待状に回答する</button>
</a>
</section>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
AOS.init({duration:1200, once:true});

/* モーダル */
function openModal(src){
  document.getElementById("modal").style.display="flex";
  document.getElementById("modalImg").src=src;
}
function closeModal(){
  document.getElementById("modal").style.display="none";
}

/* カウントダウン */
const weddingDate = new Date("2027-02-25T00:00:00");
function updateCountdown(){
  const now = new Date();
  const diff = weddingDate - now;
  const days = Math.floor(diff / (1000*60*60*24));
  document.getElementById("countdown").innerText =
  "Wedding Dayまであと " + days + " 日";
}
updateCountdown();
setInterval(updateCountdown, 86400000);
</script>

</body>
</html>
