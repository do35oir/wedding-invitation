<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
body{
  font-family:'Noto Serif JP',serif;
  background:#F5F1EA;
  text-align:center;
  padding:60px 20px;
}
form{
  max-width:500px;
  margin:auto;
}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:1px solid #D8CFC4;
  border-radius:8px;
}
button{
  margin-top:20px;
  padding:14px 30px;
  background:#C8B6A6;
  color:white;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>RSVP</h1>
<p>ご出欠のご連絡をお願いいたします。</p>

<form action="thankyou.html">
<input type="text" placeholder="お名前" required>

<select required>
<option value="">ご出欠</option>
<option>出席</option>
<option>欠席</option>
</select>

<textarea placeholder="メッセージ"></textarea>

<button type="submit">送信する</button>
</form>

</body>
</html>
